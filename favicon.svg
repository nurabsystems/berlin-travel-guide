<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E6F5C"/>
      <stop offset="100%" stop-color="#145043"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Brandenburg Gate silhouette -->
  <rect x="8" y="46" width="48" height="4" fill="#FFFFFF" opacity="0.95"/>
  <rect x="12" y="26" width="4" height="20" fill="#FFFFFF"/>
  <rect x="20" y="26" width="4" height="20" fill="#FFFFFF"/>
  <rect x="30" y="26" width="4" height="20" fill="#FFFFFF"/>
  <rect x="40" y="26" width="4" height="20" fill="#FFFFFF"/>
  <rect x="48" y="26" width="4" height="20" fill="#FFFFFF"/>
  <rect x="8" y="20" width="48" height="5" fill="#FFFFFF"/>

  <!-- Quadriga (horse chariot) hint in accent color -->
  <rect x="26" y="14" width="12" height="3" fill="#F4A261"/>
  <circle cx="32" cy="10" r="3" fill="#F4A261"/>
</svg>